name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Release scripts
        run: scripts/test-release-scripts.sh
      - name: Bundle
        run: ./scripts/build-app.sh
      - name: Check the bundle
        run: |
          codesign --verify --deep --strict "build/Vibe Kit.app"
          "build/Vibe Kit.app/Contents/MacOS/VibeKit" --list > /dev/null
